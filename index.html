<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thi thử Lịch sử 9 – Giữa kì I (26-27)</title>
<style>
:root{--p:#4f46e5;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--mut:#64748b}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#eef2ff,#f8fafc);color:#0f172a;min-height:100vh}
.wrap{max-width:1100px;margin:auto;padding:10px}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 14px #0f172a1a;padding:16px;margin-bottom:12px;overflow-wrap:anywhere}
.top{position:sticky;top:6px;z-index:5}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tm{font:700 1.15rem ui-monospace,Consolas,monospace;background:#eef2ff;color:var(--p);padding:4px 12px;border-radius:999px}
.tm.low{background:#fee2e2;color:var(--bad)}
.bar{height:8px;background:#e2e8f0;border-radius:9px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6366f1,#22c55e);transition:width .3s}
small,.mut{color:var(--mut)}
.btn{border:0;background:var(--p);color:#fff;font:600 1rem inherit;padding:10px 18px;border-radius:10px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:#e2e8f0;color:#0f172a}.btn.fl{background:#fef3c7;color:#92400e}.btn.fl.on{background:var(--warn);color:#fff}
.layout{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:860px){.layout{grid-template-columns:1fr 300px}.layout aside{position:sticky;top:120px;align-self:start;max-height:calc(100vh - 140px);overflow:auto}}
.tag{display:inline-block;font-size:.85rem;font-weight:700;color:var(--p);background:#eef2ff;padding:3px 10px;border-radius:999px;margin-bottom:8px}
h1{font-size:1.5rem;margin:.2em 0}h2{font-size:1.15rem;margin:.3em 0 .6em}h3{font-size:1rem;margin:.8em 0 .4em}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid #e2e8f0;border-radius:12px;margin:8px 0;cursor:pointer}
.opt b{min-width:26px;height:26px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:.85rem;flex:none}
.opt.sel{border-color:var(--p);background:#eef2ff}.opt.sel b{background:var(--p);color:#fff}
.opt.ok{border-color:var(--ok);background:#f0fdf4;cursor:default}.opt.bad{border-color:var(--bad);background:#fef2f2;cursor:default}
.pass{background:#f8fafc;border-left:4px solid var(--p);padding:12px 14px;border-radius:8px;margin:8px 0;font-size:.97rem}
.tf{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:10px 0}
.tf p{margin:0 0 8px}.tfr{display:flex;gap:8px}
.tfb{flex:1;padding:10px;border:2px solid #e2e8f0;background:#fff;border-radius:10px;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.tfb.sel{border-color:var(--p);background:var(--p);color:#fff}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.foot .btn{flex:1;min-width:100px}
textarea,input[type=text],select{width:100%;padding:10px;border:2px solid #e2e8f0;border-radius:10px;font:inherit}
textarea{min-height:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.nb{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 0;cursor:pointer;font:inherit}
.nb.wide{grid-column:1/-1;padding:10px;text-align:left;padding-left:12px}
.nb.done{background:#e0e7ff;border-color:var(--p)}.nb.part{background:#fef9c3}
.nb.cur{outline:2px solid var(--p);outline-offset:1px;font-weight:700}.nb.fl{box-shadow:inset 0 -4px 0 var(--warn)}
.leg{font-size:.8rem;color:var(--mut);margin-top:10px}
.score{font-size:3.2rem;font-weight:800;color:var(--p);line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:14px 0}
.stat{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.4rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:700;background:#e2e8f0}
.chip.ok{background:#dcfce7;color:#166534}.chip.bad{background:#fee2e2;color:#991b1b}
.rv{border-left:5px solid #cbd5e1}.rv.ok{border-color:var(--ok)}.rv.bad{border-color:var(--bad)}
input::placeholder,textarea::placeholder{color:#94a3b8;font-style:italic}
.ex{background:#f1f5f9;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.93rem}

.btn,.tfb,.opt{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,background .2s,border-color .2s,color .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 14px #4f46e540}
.btn:active:not(:disabled),.tfb:active,.opt:active{transform:scale(.96)}
.opt:hover,.tfb:hover{border-color:#a5b4fc}
.opt.sel,.tfb.sel{animation:pop .3s ease}
.rp{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
.btn.sec .rp,.tfb .rp,.opt .rp{background:#4f46e533}
@keyframes rp{to{transform:scale(2.6);opacity:0}}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes inN{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.45}}
.card{animation:rise .45s both}
#q{transition:opacity .17s,transform .17s}
#q.out-n{opacity:0;transform:translateX(-36px)}#q.out-p{opacity:0;transform:translateX(36px)}
#q.in-n{animation:inN .3s ease both}#q.in-p{animation:inP .3s ease both}
.tm.low{animation:blink 1s infinite}
.bar i{transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#md{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;z-index:50;padding:16px}
#md.on{display:grid;animation:fadeIn .2s}
#md .box{background:#fff;border-radius:16px;padding:20px;max-width:380px;width:100%;animation:pop .3s}
#cut{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 40%,#1e1b4b,#050816 70%);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden}
#cut.on{display:flex;animation:fadeIn .6s}
#cs{width:100%;max-width:420px}#cs h2,#cs h3{margin:.6em 0;font-weight:600;letter-spacing:.02em}
.skip{position:absolute;top:14px;right:14px;background:#ffffff1f;color:#fff;border:0;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.dots::after{content:"";animation:dots 1.2s steps(1) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.beat{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;border:3px solid #818cf8;animation:beat 1s infinite}
@keyframes beat{0%,100%{transform:scale(1);box-shadow:0 0 0 0 #818cf877}15%{transform:scale(1.25);box-shadow:0 0 0 18px #818cf800}35%{transform:scale(1)}50%{transform:scale(1.14)}}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin:14px auto}
.cells i{aspect-ratio:1;border-radius:6px;background:#1e293b;transition:background .15s,transform .15s}
.cells i.on{background:#818cf8;transform:scale(1.12)}
.zoom{font-size:1.5rem;animation:zoom 1.9s ease-out both}
@keyframes zoom{from{opacity:0;transform:scale(.7)}30%{opacity:1}to{opacity:1;transform:scale(1.08)}}
.flash{position:absolute;inset:0;background:#fff;animation:flash .7s forwards;pointer-events:none}
@keyframes flash{from{opacity:1}to{opacity:0}}
.big{font-size:clamp(4rem,22vw,7rem);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.big.land{animation:land .7s ease}
.big.hi{color:#4ade80}.big.mid{color:#a5b4fc}.big.lo{color:#fca5a5}
@keyframes land{0%{transform:scale(1.5);filter:brightness(2)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.sm{font-size:1.1rem;color:#cbd5e1;min-height:1.6em}
.cf{position:absolute;top:-14px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="cut"></div><div id="md"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCD";

/* ================= NGÂN HÀNG CÂU HỎI (trích từ tài liệu "Ôn tập giữa kì I Lịch sử và Địa lí 9 (26-27)") ================= */
const MC=[
["Đảng Bôn-sê-vích quyết định thực hiện Chính sách kinh tế mới vào thời gian nào?",["Cuối năm 1920","3/1921","12/1922","12/1925"],1],
["Trải qua 2 kế hoạch 5 năm (1928 – 1937), sản lượng công nghiệp của Liên Xô đứng thứ mấy ở Châu Âu?",["Nhất","Hai","Ba","Tư"],0],
["Liên bang Cộng hoà xã hội chủ nghĩa Xô viết (còn gọi là Liên Xô) được thành lập vào",["Cuối năm 1920","3/1921","12/1922","12/1925"],2],
["Trải qua 2 kế hoạch 5 năm (1928 – 1937), sản lượng công nghiệp của Liên Xô đứng thứ mấy trên thế giới?",["Nhất","Hai","Ba","Tư"],1],
["Cuộc khủng hoảng kinh tế thế giới diễn ra trong khoảng thời gian nào?",["1918 – 1923","1924 – 1929","1929 – 1933","1935 – 1939"],2],
["Cuộc khủng hoảng kinh tế 1929 – 1933 bắt đầu từ quốc gia nào?",["Anh","Pháp","Đức","Mỹ"],3],
["Cuộc khủng hoảng kinh tế ở nước Mĩ (1929 – 1933) bắt đầu từ lĩnh vực nào?",["Tài chính","Công nghiệp","Nông nghiệp","Thương mại – du lịch"],0],
["Người đề xướng thực hiện Chính sách mới nhằm đưa nước Mĩ thoát khỏi cuộc khủng hoảng kinh tế (1929 – 1933) là",["H. Huvơ","H. Truman","Aixenhao","Ph. Rudơven"],3],
["Để đưa nước Mĩ thoát khỏi khủng hoảng, Chính phủ Mỹ đã",["thực hiện Chính sách mới","áp dụng Chính sách kinh tế mới (NEP)","tiến hành chiến tranh xâm lược","gây ảnh hưởng của mình với các nước Mĩ La-tinh"],0],
["Ý nào không phải ý nghĩa của Chính sách mới ở Mĩ?",["Cứu nguy cho chủ nghĩa tư bản Mĩ","Duy trì chế độ dân chủ tư sản ở Mĩ","Giải quyết phần nào khó khăn của người lao động","Giúp Mĩ trở thành siêu cường kinh tế thứ 2 thế giới (sau Liên Xô)"],3],
["Sau Chiến tranh thế giới thứ nhất, phong trào đấu tranh giành độc lập dân tộc ở châu Á diễn ra như thế nào?",["Suy giảm mạnh","Hoàn toàn chấm dứt","Phát triển mạnh mẽ","Chỉ diễn ra ở Đông Á"],2],
["Đảng Cộng sản Trung Quốc được thành lập vào năm nào?",["1919","1921","1925","1927"],1],
["Sau Chiến tranh thế giới thứ nhất, quốc gia nào ở châu Á có nền kinh tế phát triển mạnh và trở thành một cường quốc?",["Ấn Độ","Nhật Bản","Trung Quốc","Việt Nam"],1],
["Năm 1931, Nhật Bản tiến hành xâm chiếm vùng nào của Trung Quốc?",["Sơn Đông","Hoa Nam","Tây Tạng","Mãn Châu"],3],
["Khối phát xít bao gồm những quốc gia nào?",["Mỹ, Pháp, Anh","Anh, Đức, Nhật Bản","I-ta-li-a, Pháp, Mỹ","Đức, I-ta-li-a, Nhật Bản"],3],
["Khối các nước tư bản dân chủ gồm những quốc gia nào?",["I-ta-li-a, Pháp, Mỹ","Mỹ, Đức, Nhật Bản","Anh, Pháp, Mỹ","Nhật Bản, I-ta-li-a, Đức"],2],
["Kẻ thù chung của hai khối các nước tư bản dân chủ và phát xít là:",["Liên Xô","Việt Nam","Thổ Nhĩ Kì","Hung – Ga – Ri"],0],
["Ngày 6 và ngày 9/8/1945, Mĩ ném bom nguyên tử xuống hai thành phố nào của Nhật Bản?",["Na-gôi-a, Tô-ki-ô","Hi-rô-si-ma, Na-ga-xa-ki","Tô-ki-ô, Ô-xa-ca","Hi-rô-si-ma, Na-gôi-a"],1],
["Trong những năm 1923 – 1924, Nguyễn Ái Quốc hoạt động ở đâu?",["Pháp","Trung Quốc","Liên Xô","Việt Nam"],2],
["Nguyễn Ái Quốc tham gia Hội liên hiệp các dân tộc bị áp bức vào thời gian nào?",["Tháng 10 – 1923","Tháng 6 – 1923","Tháng 7 – 1925","Tháng 12 – 1925"],2],
["Nguyễn Ái Quốc đóng vai trò như thế nào tại hội nghị thành lập Đảng (1/1930)?",["Chủ trì hội nghị thành lập Đảng","Tham gia hội nghị với tư cách đại biểu của Quốc tế cộng sản","Là đại biểu của một trong các tổ chức cộng sản của Việt Nam","Chủ trì và thông qua Cương lĩnh chính trị đầu tiên của Đảng"],3],
["Cách mạng giành chính quyền ở Hà Nội nổ ra vào ngày tháng năm nào?",["18-8-1945","19-8-1945","23-8-1945","28-8-1945"],1],
["Hội nghị toàn quốc của Đảng Cộng sản Đông Dương họp tại đâu vào tháng 8-1945?",["Hà Nội","Huế","Sài Gòn","Tân Trào (Tuyên Quang)"],3],
["Cách mạng tháng Tám đã mở ra cho Việt Nam kỷ nguyên",["Tiến nhanh trên con đường XHCN","Độc lập và tự do","Giàu mạnh và phát triển","Kỷ nguyên công nghiệp hóa – hiện đại hóa"],1],
["Ý nghĩa quan trọng nhất của Cách mạng tháng Tám (1945) là:",["chấm dứt sự thống trị của thực dân Pháp và phát xít Nhật đối với nước ta","người dân Việt Nam từ thân phận nô lệ trở thành người làm chủ đất nước","đem lại độc lập, tự do cho dân tộc và góp phần cổ vũ phong trào cách mạng thế giới","lật đổ ngai vàng phong kiến đã ngự trị hàng chục thế kỉ trên đất nước ta"],2]
];
const TF2=[
["Việc nhiều khu vực ở châu Âu và châu Á bị tàn phá nặng nề cho thấy Chiến tranh thế giới thứ hai đã gây hậu quả nghiêm trọng về vật chất.",1],
["Những tổn thất về người và cơ sở vật chất sau chiến tranh chỉ ảnh hưởng đến các nước bại trận.",0],
["Chiến tranh thế giới thứ hai kết thúc đã làm thay đổi đáng kể tương quan lực lượng giữa các quốc gia trên thế giới.",1],
["Sự vươn lên của Hoa Kỳ và Liên Xô sau năm 1945 phản ánh sự thay đổi tương quan lực lượng thế giới sau chiến tranh.",1],
["Sau năm 1945, Hoa Kỳ và Liên Xô trở thành hai cường quốc có ảnh hưởng lớn trên thế giới.",1],
["Những tổn thất do chiến tranh gây ra làm cho nhu cầu duy trì hòa bình và hợp tác quốc tế trở nên cấp thiết hơn.",1],
["Sự hình thành trật tự thế giới mới sau năm 1945 hoàn toàn không liên quan đến những biến đổi do Chiến tranh thế giới thứ hai gây ra.",0],
["Chiến tranh thế giới thứ hai không chỉ làm thay đổi tình hình kinh tế, xã hội mà còn tác động đến quan hệ quốc tế sau năm 1945.",1],
["Việc Hoa Kỳ và Liên Xô nổi lên thành hai cường quốc có ảnh hưởng lớn cho thấy thế giới sau chiến tranh có sự phân bố lại sức mạnh giữa các quốc gia.",1],
["Hậu quả nặng nề của chiến tranh góp phần thúc đẩy các quốc gia quan tâm hơn đến việc xây dựng một cơ chế hợp tác nhằm duy trì hòa bình.",1],
["Từ hậu quả của Chiến tranh thế giới thứ hai, có thể rút ra rằng việc giải quyết mâu thuẫn giữa các quốc gia bằng chiến tranh có thể gây hậu quả lâu dài đối với cả nhân loại.",1],
["Nếu chiến tranh không gây ra những tổn thất nghiêm trọng về người và cơ sở vật chất thì nhu cầu xây dựng một cơ chế hợp tác quốc tế để duy trì hòa bình sau năm 1945 chắc chắn vẫn không thay đổi.",0],
["Sự nổi lên của Hoa Kỳ và Liên Xô sau năm 1945 là một trong những cơ sở quan trọng để giải thích sự hình thành cục diện thế giới mới sau Chiến tranh thế giới thứ hai.",1],
["Từ sự thay đổi tương quan lực lượng sau chiến tranh, có thể thấy kết thúc một cuộc chiến tranh lớn không đồng nghĩa với việc các mâu thuẫn và cạnh tranh quốc tế chấm dứt hoàn toàn.",1],
["Hậu quả của Chiến tranh thế giới thứ hai cho thấy hòa bình sau năm 1945 chỉ là vấn đề riêng của các quốc gia từng trực tiếp tham chiến, không phải vấn đề chung của cộng đồng quốc tế.",0],
["Việc thành lập các tổ chức và cơ chế hợp tác quốc tế sau năm 1945 có thể được xem là một giải pháp nhằm hạn chế nguy cơ xảy ra những cuộc xung đột quy mô lớn trong tương lai.",1],
["Từ sự thay đổi tương quan lực lượng sau năm 1945, có thể khẳng định mọi quốc gia trên thế giới đều có vai trò và sức mạnh ngang nhau trong quan hệ quốc tế.",0],
["Những biến đổi về tương quan lực lượng và nhu cầu duy trì hòa bình sau năm 1945 cho thấy Chiến tranh thế giới thứ hai không chỉ kết thúc một cuộc xung đột quân sự mà còn tạo ra những biến chuyển sâu sắc trong quan hệ quốc tế.",1]
];
const TF3=[
["Đảng Cộng sản Việt Nam ra đời là một bước ngoặt lịch sử trong sự nghiệp đấu tranh giải phóng dân tộc của nhân dân Việt Nam.",1],

["Sự ra đời của Đảng Cộng sản Việt Nam chỉ là kết quả của sự phát triển riêng biệt của phong trào công nhân Việt Nam.",0],

];
const SEC=[
{title:"Phần I. Trắc nghiệm nhiều lựa chọn (Lịch sử)",pages:MC.map((m,k)=>({t:"mc",n:k+1,q:m[0],o:m[1],a:m[2]}))},
{title:"Phần II. Đúng/Sai – Tư liệu về hậu quả Chiến tranh thế giới thứ hai",pages:[{t:"tf",
 pass:"Khi Chiến tranh thế giới thứ hai kết thúc năm 1945, nhiều khu vực ở châu Âu và châu Á bị tàn phá nặng nề. Các nước tham chiến phải đối mặt với những tổn thất rất lớn về người và cơ sở vật chất. Chiến tranh làm thay đổi sâu sắc tương quan lực lượng trên thế giới. Hoa Kỳ và Liên Xô nổi lên là hai cường quốc có ảnh hưởng lớn. Đồng thời, nhu cầu duy trì hòa bình và hợp tác quốc tế trở nên cấp thiết. Đây là một trong những cơ sở dẫn tới sự hình thành trật tự thế giới mới sau năm 1945.",
 src:"Nguồn: U.S. Department of State, Office of the Historian, The World in 1945.",items:TF2}]},
{title:"Phần III. Đúng/Sai – Tư liệu về sự ra đời của Đảng Cộng sản Việt Nam",pages:[{t:"tf",
 pass:"Sự thành lập của Đảng Cộng sản Việt Nam là một sự kiện chính trị trọng đại, một bước ngoặt lịch sử trong sự nghiệp đấu tranh giải phóng dân tộc của nhân dân Việt Nam. Đảng Cộng sản Việt Nam ra đời là kết quả của sự kết hợp giữa chủ nghĩa Mác – Lênin với phong trào công nhân và phong trào yêu nước Việt Nam.",
 src:"(Theo Viện sử học, Lịch sử Việt Nam, Tập 8, NXB Khoa học xã hội, 2017, tr 571)",items:TF3}]}
/* Tài liệu không có câu trả lời ngắn / tự luận. Để thêm, dùng:
   {t:"sa",n:1,q:"...",ans:["đáp án 1","đáp án 2"]}  hoặc  {t:"es",n:1,q:"...",ref:"đáp án tham khảo",rubric:["tiêu chí 1","tiêu chí 2"]} */
];

/* ================= LOGIC ================= */
let S,P=[],TOTAL=0;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function build(sh){
 P=[];
 SEC.forEach((s,si)=>{
  let pg=s.pages.map(p=>({...p}));
  if(sh){
   pg.forEach(p=>{
    if(p.t==="mc"){const ix=shuf(p.o.map((_,k)=>k));p.a=ix.indexOf(p.a);p.o=ix.map(k=>p.o[k])}
    if(p.t==="tf")p.items=shuf(p.items);
   });
   if(pg[0].t!=="tf")pg=shuf(pg);
  }
  let c=0;
  pg.forEach(p=>{
   if(p.t==="tf")p.items.forEach(it=>P.push({t:"ti",si,pass:p.pass,src:p.src,q:it[0],a:!!it[1],n:++c,of:p.items.length}));
   else{p.n=++c;P.push({...p,si})}
  });
 });
 TOTAL=P.filter(p=>p.t!=="es").length;
}
function reset(){S={A:{},F:{},cur:0,left:0,mins:45,t:null,done:false,only:false}}
const has=(p,a)=>p.t==="mc"||p.t==="ti"?a!=null:!!(a&&a.trim());
const norm=s=>s.normalize("NFC").toLowerCase().replace(/[.,;:!?'"()\s]+/g," ").trim();
function grade(p,a){
 if(p.t==="mc"||p.t==="ti")return[a===p.a?1:0,1];
 if(p.t==="sa")return[a&&p.ans.some(x=>norm(x)===norm(a))?1:0,1];
 return[0,0];
}
const answered=()=>P.reduce((s,p,i)=>s+(p.t!=="es"&&has(p,S.A[i])?1:0),0);
const fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
const secName=p=>SEC[p.si].title;

function ask(m,yes,y="Đồng ý"){
 const e=$("md");e.innerHTML=`<div class="box"><p>${esc(m)}</p><div class="foot"><button class="btn sec" id="mn">Quay lại</button><button class="btn" id="my">${y}</button></div></div>`;
 e.className="on";$("mn").onclick=()=>{e.className=""};$("my").onclick=()=>{e.className="";yes()};
}

function showStart(){
 reset();
 $("app").innerHTML=`<div class="card" style="max-width:640px;margin:20px auto">
 <span class="tag">Thi thử trực tuyến</span><h1>Ôn tập giữa kì I – Lịch sử 9 (26-27)</h1>
 <p class="mut">Ngân hàng câu hỏi được trích trực tiếp từ tài liệu ôn tập bạn cung cấp.</p>
 <ul><li>Phần I: ${MC.length} câu trắc nghiệm một đáp án đúng</li><li>Phần II: ${TF2.length} ý Đúng/Sai (tư liệu Chiến tranh thế giới thứ hai)</li><li>Phần III: ${TF3.length} ý Đúng/Sai (tư liệu sự ra đời của Đảng)</li><li>Làm lần lượt từng câu, xong câu này sang câu sau</li><li>Tổng: <b>${TOTAL}</b> ý chấm điểm · thang 10, mỗi ý bằng nhau</li><li><b>Làm xong hết mới chấm điểm</b>: đáp án và lời giải chỉ hiện sau khi nộp bài</li></ul>
 <h3>Thời gian làm bài</h3>
 <select id="mins"><option value="30">30 phút</option><option value="45" selected>45 phút</option><option value="60">60 phút</option><option value="90">90 phút</option></select>
 <p class="mut"><small>Tài liệu không nêu thời gian làm bài nên bạn tự chọn.</small></p>
 <label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="shf"> Trộn câu hỏi và đáp án</label>
 <button class="btn" style="width:100%;margin-top:8px" onclick="start()">Bắt đầu làm bài</button></div>`;
}
function start(){
 const m=+$("mins").value,sh=$("shf").checked;
 reset();S.mins=m;S.left=m*60;build(sh);
 showExam();clearInterval(S.t);
 S.t=setInterval(()=>{S.left--;tick();if(S.left<=0)doFinish(true)},1000);
 window.onbeforeunload=e=>{if(!S.done){e.preventDefault();e.returnValue=""}};
}
function tick(){const e=$("tm");if(!e)return;e.textContent=fmt(Math.max(S.left,0));e.className="tm"+(S.left<=300?" low":"")}
function showExam(){
 $("app").innerHTML=`<div class="card top"><div class="row"><b>Lịch sử 9 – Giữa kì I</b><span id="tm" class="tm"></span><span><button class="btn sec" onclick="reshuffle()">Trộn câu</button> <button class="btn" onclick="finish()">Nộp bài</button></span></div>
 <div class="bar"><i id="pb"></i></div><small id="pt"></small></div><div class="card" id="q"></div>`;
 tick();renderQ("n");
}
function renderProg(){const a=answered();$("pb").style.width=(a/TOTAL*100)+"%";$("pt").textContent=`Câu ${S.cur+1}/${P.length} · đã trả lời ${a}/${TOTAL}`}
function renderQ(dir){
 const i=S.cur,p=P[i],a=S.A[i],last=i===P.length-1;
 let h=`<span class="tag">${esc(secName(p))}${p.t==="ti"?` · ý ${p.n}/${p.of}`:""}</span>`;
 if(p.t==="mc"){
  h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2>`+p.o.map((o,j)=>`<div class="opt${a===j?" sel":""}" data-v="${j}" onclick="pick(${j})"><b>${L[j]}</b><span>${esc(o)}</span></div>`).join("");
 }else if(p.t==="ti"){
  h+=`<div class="pass">${esc(p.pass)}<br><small>${esc(p.src)}</small></div><div class="tf"><p><b>${p.n}.</b> ${esc(p.q)}</p><div class="tfr"><button class="tfb${a===true?" sel":""}" data-v="true" onclick="pick(true)">Đúng</button><button class="tfb${a===false?" sel":""}" data-v="false" onclick="pick(false)">Sai</button></div></div>`;
 }else{
  h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2>`+(p.t==="sa"?`<input type="text" placeholder="Nhập đáp án..." value="${esc(a||"")}" oninput="txt(this.value)">`:`<textarea placeholder="Nhập câu trả lời..." oninput="txt(this.value)">${esc(a||"")}</textarea>`);
 }
 h+=`<div class="foot"><button class="btn sec" onclick="go(${i-1})" ${i?"":"disabled"}>Câu trước</button><button class="btn fl${S.F[i]?" on":""}" id="fb" onclick="flag()">${S.F[i]?"Đã đánh dấu xem lại":"Đánh dấu xem lại"}</button><button class="btn" onclick="${last?"finish()":`go(${i+1})`}">${last?"Nộp bài":"Câu sau"}</button></div>`;
 const q=$("q");q.className="card"+(dir?" in-"+dir:"");q.innerHTML=h;renderProg();
}
function go(i){
 if(i<0||i>=P.length||S.busy)return;
 const dir=i>S.cur?"n":"p";S.busy=1;$("q").className="card out-"+dir;
 setTimeout(()=>{S.cur=i;renderQ(dir);window.scrollTo({top:0,behavior:"smooth"});S.busy=0},170);
}
function pick(v){S.A[S.cur]=v;document.querySelectorAll("#q [data-v]").forEach(e=>e.classList.toggle("sel",e.dataset.v===String(v)));renderProg()}
function txt(v){S.A[S.cur]=v;renderProg()}
function flag(){const i=S.cur;S.F[i]=!S.F[i];const b=$("fb");b.classList.toggle("on",!!S.F[i]);b.firstChild.textContent=S.F[i]?"Đã đánh dấu xem lại":"Đánh dấu xem lại"}
function reshuffle(){
 const run=()=>{S.A={};S.F={};S.cur=0;build(true);renderQ("n");window.scrollTo({top:0})};
 Object.keys(S.A).length?ask("Trộn lại sẽ xóa các câu đã làm. Tiếp tục?",run,"Trộn lại"):run();
}
function finish(){
 const un=TOTAL-answered(),fl=Object.values(S.F).filter(Boolean).length;
 let m=un?`Bạn còn ${un} ý chưa trả lời. `:"Bạn đã trả lời hết các ý. ";
 if(fl)m+=`Có ${fl} câu đang đánh dấu xem lại. `;
 ask(m+"Nộp bài và chấm điểm ngay?",()=>doFinish(false),"Nộp bài");
}
function doFinish(timeout){
 clearInterval(S.t);S.done=true;window.onbeforeunload=null;$("md").className="";cut(timeout);
}
function calc(){
 let right=0,tot=0,ans=0;
 P.forEach((p,i)=>{const g=grade(p,S.A[i]);right+=g[0];tot+=g[1];if(p.t!=="es"&&has(p,S.A[i]))ans++});
 return{right,tot,ans,score:tot?right/tot*10:0};
}

/* ===== Cảnh cắt khi nộp bài ===== */
function cut(timeout){
 const R=calc(),el=$("cut");
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){showResult(timeout);return}
 const T=[],at=(ms,f)=>T.push(setTimeout(f,ms));
 const done=()=>{T.forEach(x=>{clearTimeout(x);clearInterval(x)});cancelAnimationFrame(S.raf);el.className="";el.innerHTML="";showResult(timeout)};
 el.className="on";
 el.innerHTML=`<button class="skip" id="skip">Bỏ qua</button><div id="cs"></div>`;
 $("skip").onclick=done;
 const cs=$("cs");
 cs.innerHTML=`<div class="beat"></div><h2 class="dots">Đang thu bài</h2>`;
 at(1300,()=>{
  cs.innerHTML=`<h3>Đang chấm từng câu</h3><div class="cells">${P.map(()=>"<i></i>").join("")}</div><p class="sm" id="cc">0/${P.length}</p>`;
  const cells=cs.querySelectorAll(".cells i");let k=0;
  const iv=setInterval(()=>{if(k<P.length){cells[k].classList.add("on");k++;$("cc").textContent=k+"/"+P.length}else clearInterval(iv)},Math.max(20,1900/P.length));
  T.push(iv);
 });
 at(3500,()=>{cs.innerHTML=`<div class="beat" style="animation-duration:.7s"></div><h2 class="zoom">Kết quả của bạn là</h2>`});
 at(5500,()=>{
  el.insertAdjacentHTML("beforeend",'<div class="flash"></div>');
  const cls=R.score>=8?"hi":R.score>=5?"mid":"lo";
  cs.innerHTML=`<div class="big" id="bg">0.00</div><p class="sm" id="sm"></p><div id="act"></div>`;
  const t0=performance.now(),D=2200;
  const step=now=>{
   const k=Math.min((now-t0)/D,1),e=1-Math.pow(1-k,4);
   $("bg").textContent=(R.score*e).toFixed(2);
   if(k<1)S.raf=requestAnimationFrame(step);
   else{
    $("bg").className="big land "+cls;$("sm").textContent=`${R.right}/${R.tot} ý đúng · thang điểm 10`;
    $("act").innerHTML='<button class="btn" style="margin-top:18px" id="see">Xem chi tiết bài làm</button>';$("see").onclick=done;
    if(R.score>=8)confetti(el);
   }
  };
  S.raf=requestAnimationFrame(step);
 });
}
function confetti(el){
 const c=["#4ade80","#818cf8","#fbbf24","#f472b6","#38bdf8"];
 for(let i=0;i<70;i++){const d=document.createElement("i");d.className="cf";d.style.cssText=`left:${Math.random()*100}%;background:${c[i%5]};animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.8}s`;el.appendChild(d)}
}

/* ================= KẾT QUẢ ================= */
function showResult(timeout){
 const R=calc(),right=R.right,tot=R.tot,ans=R.ans,score=R.score;
 const ss=SEC.map(()=>({r:0,t:0}));
 P.forEach((p,i)=>{const g=grade(p,S.A[i]);ss[p.si].r+=g[0];ss[p.si].t+=g[1]});
 const wrong=ans-right,blank=tot-ans;
 let wk=-1,wr=2;ss.forEach((s,k)=>{if(s.t&&s.r/s.t<wr){wr=s.r/s.t;wk=k}});
 const lvl=score>=8?"Rất tốt! Bạn nắm vững kiến thức trong tài liệu.":score>=6.5?"Khá tốt, cần củng cố thêm một số nội dung.":score>=5?"Đạt mức trung bình, bạn nên ôn lại kĩ hơn.":"Chưa đạt, hãy ôn lại tài liệu và làm lại bài.";
 let h=`<div class="card" style="text-align:center"><span class="tag">Kết quả${timeout?" · hết giờ, bài được tự động nộp":""}</span><div class="score">${score.toFixed(2)}<small>/10</small></div>
 <p><b>${lvl}</b>${wk>=0&&wr<1?`<br><span class="mut">Cần chú ý nhất: ${esc(SEC[wk].title)} (${ss[wk].r}/${ss[wk].t} ý đúng).</span>`:""}</p>
 <div class="stats"><div class="stat"><b style="color:var(--ok)">${right}</b>Đúng</div><div class="stat"><b style="color:var(--bad)">${wrong}</b>Sai</div><div class="stat"><b>${blank}</b>Bỏ trống</div><div class="stat"><b>${tot}</b>Tổng số ý</div></div>
 <div style="text-align:left">${SEC.map((s,k)=>`<p>${esc(s.title)}: <b>${ss[k].r}/${ss[k].t}</b></p>`).join("")}</div>
 <p class="mut"><small>Thang 10 = số ý đúng ÷ ${tot} × 10. Câu tự luận (nếu có) không được tự động chấm.</small></p>
 <div class="foot"><button class="btn" onclick="showStart()">Làm lại bài thi</button><button class="btn sec" onclick="S.only=!S.only;showResult()">${S.only?"Hiện tất cả":"Chỉ hiện câu sai / bỏ trống"}</button></div></div>`;
 P.forEach((p,i)=>{
  const g=grade(p,S.A[i]),a=S.A[i],ok=g[0]===1;if(S.only&&ok)return;
  const st=ok?"Đúng":has(p,a)?"Sai":"Bỏ trống";
  h+=`<div class="card rv ${ok?"ok":"bad"}"><span class="tag">${esc(secName(p).split(".")[0])} · ${p.t==="ti"?`ý ${p.n}`:`câu ${p.n}`} · ${p.t==="es"?"tự đánh giá":st}</span>`;
  if(p.t==="mc"){
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2>`+p.o.map((o,j)=>`<div class="opt ${j===p.a?"ok":a===j?"bad":""}"><b>${L[j]}</b><span>${esc(o)}${j===p.a?" (đáp án đúng)":a===j?" (bạn chọn)":""}</span></div>`).join("")+
   `<div class="ex">Lời giải: đáp án đúng theo tài liệu ôn tập là <b>${L[p.a]}. ${esc(p.o[p.a])}</b>.</div>`;
  }else if(p.t==="ti"){
   h+=`<details><summary>Xem lại đoạn tư liệu</summary><div class="pass">${esc(p.pass)}<br><small>${esc(p.src)}</small></div></details><div class="tf"><p><b>${p.n}.</b> ${esc(p.q)}</p><span class="chip ${ok?"ok":"bad"}">Bạn chọn: ${a==null?"Bỏ trống":a?"Đúng":"Sai"}</span> <span class="chip">Đáp án: ${p.a?"Đúng":"Sai"}</span></div><div class="ex">Lời giải: đáp án lấy theo tài liệu ôn tập; đối chiếu với đoạn tư liệu ở trên.</div>`;
  }else if(p.t==="sa"){
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2><p>Bạn trả lời: <b>${esc(a||"(bỏ trống)")}</b></p><div class="ex">Đáp án chấp nhận: ${p.ans.map(esc).join(" / ")}</div>`;
  }else{
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2><p>Bài làm của bạn:<br>${esc(a||"(bỏ trống)").replace(/\n/g,"<br>")}</p><div class="ex"><b>Đáp án tham khảo:</b> ${esc(p.ref)}<br><b>Tiêu chí tự đánh giá:</b><ul>${p.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  }
  h+="</div>";
 });
 const app=$("app");app.innerHTML=h;
 app.querySelectorAll(".card").forEach((c,k)=>{c.style.animationDelay=Math.min(k*.06,.6)+"s"});
 window.scrollTo(0,0);
}
document.addEventListener("pointerdown",e=>{
 const b=e.target.closest&&e.target.closest(".btn,.tfb,.opt");if(!b||b.disabled)return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
 s.className="rp";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 b.appendChild(s);setTimeout(()=>s.remove(),650);
});
build(false);showStart();
</script>
</body>
</html>
