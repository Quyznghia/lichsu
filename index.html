<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thi thử Lịch sử 9 – Giữa kì I (26-27)</title>
<style>
@property --ang{syntax:"<angle>";inherits:false;initial-value:0deg}
:root{--hue:30;--ok:#2f6b49;--bad:#8a3a43;
--bg:hsl(var(--hue) 40% 96%);--card:hsl(var(--hue) 45% 99%);--ink:#2d2b33;--mut:#7a7884;--line:hsl(var(--hue) 28% 87%);
--opt:hsl(var(--hue) 55% 96%);--sel:hsl(var(--hue) 65% 88%);--selb:hsl(var(--hue) 45% 62%);
--b1:#d6dcfb;--b1t:#2f3a75;--b2:hsl(var(--hue) 22% 92%);--b2t:#4a4752;--okbg:#d9f0e3;--badbg:#f7dadd;--stk:#4b5568;--n1:#7dd3c0;--n2:#b9a6ff}
[data-theme=dark]{--bg:#0d1020;--card:#151a2e;--ink:#e4e7f5;--mut:#8d92ad;--line:#262c49;--opt:#1a2038;--sel:#2b3466;--selb:#8f9dff;--b1:#2c3566;--b1t:#dfe4ff;--b2:#20263f;--b2t:#c3c8e6;--okbg:#17352a;--badbg:#3a1f28;--stk:#c9d0ea;--ok:#8fe0b5;--bad:#f2a1ac}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;transition:background .8s,color .8s}
.wrap{max-width:760px;margin:auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px;overflow-wrap:anywhere;animation:fade .3s both;transition:background .8s,border-color .8s}
.top{position:sticky;top:6px;z-index:5}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tools{margin-top:8px;justify-content:flex-start}
.tm{font:600 1.05rem ui-monospace,Consolas,monospace;color:var(--mut)}.tm.low{color:var(--bad)}
.bar{height:4px;background:var(--line);border-radius:4px;margin:10px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--selb);transition:width .4s ease}
small,.mut{color:var(--mut)}
.btn{border:0;background:var(--b1);color:var(--b1t);font:600 1rem inherit;font-family:inherit;padding:10px 18px;border-radius:12px;cursor:pointer;transition:background .2s,transform .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(.96)}[data-theme=dark] .btn:hover:not(:disabled){filter:brightness(1.2)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec,.btn.fl{background:var(--b2);color:var(--b2t)}
.btn.fl.on{background:#f4e4b8;color:#6b5314}[data-theme=dark] .btn.fl.on{background:#4a3f1c;color:#f5dd9a}
.btn.sm{padding:6px 12px;font-size:.85rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--mut);background:var(--opt);padding:2px 10px;border-radius:999px;margin-bottom:8px}
h1{font-size:1.45rem;margin:.2em 0}h2{font-size:1.12rem;margin:.3em 0 .7em;font-weight:600}h3{font-size:1rem;margin:.9em 0 .4em}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid transparent;background:var(--opt);border-radius:12px;margin:8px 0;cursor:pointer;transition:background .6s,border-color .25s}
.opt b{min-width:26px;height:26px;border-radius:50%;background:var(--card);color:var(--mut);display:grid;place-items:center;font-size:.8rem;flex:none}
.opt>span{flex:1}
.opt:hover{border-color:var(--line)}
.opt.sel{background:var(--sel);border-color:var(--selb)}
.opt.ok{background:var(--okbg);cursor:default}.opt.bad{background:var(--badbg);cursor:default}
.pass{background:var(--opt);border-left:3px solid var(--selb);padding:12px 14px;border-radius:8px;margin:8px 0;font-size:.96rem}
.tf{position:relative;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}.tf p{margin:0 0 8px}
.tfr{display:flex;gap:8px}
.tfb{flex:1;padding:10px;border:1.5px solid transparent;background:var(--opt);color:var(--ink);border-radius:10px;font:600 1rem inherit;font-family:inherit;cursor:pointer;transition:background .3s,border-color .25s,transform .12s}
.tfb:hover{border-color:var(--line)}.tfb:active{transform:scale(.98)}.tfb.sel{background:var(--sel);border-color:var(--selb)}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.foot .btn{flex:1;min-width:100px}
textarea,input[type=text],select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
textarea{min-height:140px}
input::placeholder,textarea::placeholder{color:var(--mut)}
/* viền gradient lỏng khi rê chuột; chế độ tối: viền neon chạy quanh */
.glow{position:relative}
.glow::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;pointer-events:none;opacity:0;transition:opacity .6s;
 background:linear-gradient(120deg,#cfd8ff,#ffd9e6,#d7f5e4,#fff0c9,#cfd8ff);background-size:300% 300%;animation:drift 8s ease-in-out infinite;
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
.glow:hover::before{opacity:1}
[data-theme=dark] .glow::before{background:conic-gradient(from var(--ang),transparent 0 70%,var(--n1) 86%,var(--n2) 100%);background-size:auto;animation:spin 6s linear infinite}
[data-theme=dark] #q.glow::before{opacity:1}
@keyframes drift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes spin{to{--ang:360deg}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes inN{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes inP{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
#q{transition:opacity .13s,transform .13s}
#q.out-n{opacity:0;transform:translateX(-12px)}#q.out-p{opacity:0;transform:translateX(12px)}
#q.in-n{animation:inN .24s ease both}#q.in-p{animation:inP .24s ease both}
#md{position:fixed;inset:0;background:#0f172a55;display:none;place-items:center;z-index:50;padding:16px}
#md.on{display:grid;animation:fade .25s}
#md .box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:380px;width:100%}
#cut{position:fixed;inset:0;z-index:99;background:var(--bg);display:none;place-items:center;text-align:center;padding:20px}
#cut.on{display:grid;animation:fade .3s}
.scan{height:3px;width:min(280px,70vw);background:var(--line);border-radius:3px;overflow:hidden;margin:14px auto}
.scan i{display:block;height:100%;width:0;background:var(--selb);animation:fill 1.6s ease-in-out forwards}
@keyframes fill{to{width:100%}}
.ring{width:70px;height:70px;margin:0 auto 16px;border-radius:50%;border:2px solid var(--selb);animation:ringb 1s infinite}
@keyframes ringb{0%,100%{transform:scale(1);box-shadow:0 0 0 0 var(--selb)}15%{transform:scale(1.22);box-shadow:0 0 0 16px transparent}35%{transform:scale(1)}50%{transform:scale(1.12)}}
.cdots{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;width:min(320px,80vw);margin:16px auto}
.cdots i{aspect-ratio:1;border-radius:50%;background:var(--line);transition:background .12s,transform .12s}
.cdots i.on{background:var(--selb);transform:scale(1.2)}
.bigq{font-size:1.6rem;font-weight:600;margin:.3em 0;animation:bigq 1s ease-out both}
@keyframes bigq{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1.06)}}
#cut #cs{transition:opacity .45s}#cut.dim #cs{opacity:.06}
#cut .fl{position:absolute;inset:0;background:var(--card);animation:flc .5s forwards;pointer-events:none}
@keyframes flc{from{opacity:1}to{opacity:0}}
.skip{position:absolute;top:14px;right:14px;background:var(--b2);color:var(--b2t);border:0;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
.score{font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:14px 0}
.stat{background:var(--opt);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:1.35rem}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.85rem;font-weight:600;background:var(--b2)}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}
.rv{border-left:4px solid var(--line)}.rv.ok{border-left-color:var(--ok)}.rv.bad{border-left-color:var(--bad)}
.rvh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ex{background:var(--opt);border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.93rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.radar{width:100%;max-width:440px;display:block;margin:auto}
.rg{fill:none;stroke:var(--line);stroke-width:1}.ax{stroke:var(--line);stroke-width:1}
.rd{fill:var(--selb);fill-opacity:.22;stroke:var(--selb);stroke-width:2;stroke-linejoin:round}.dt{fill:var(--selb)}
.rdg{transform-origin:190px 170px;transform:rotate(-40deg) scale(0);opacity:0;transition:transform 1.5s cubic-bezier(.16,1,.3,1),opacity .9s}
.rdg.on{transform:none;opacity:1}
.lb{font-size:11.5px;fill:var(--mut)}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 18px;margin-top:8px;font-size:.92rem}
.tl div{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:3px 0}
/* nhãn dán động 1:1 (SVG, lặp nhịp nhàng) */
.stk{width:48px;height:48px;flex:none;cursor:pointer;overflow:visible}.stk.s{width:30px;height:30px}
.stk path,.stk .ln{fill:none;stroke:var(--stk);stroke-width:2.8;stroke-linecap:round}
.stk .face,.stk .tear,.stk .zz{transform-box:fill-box;transform-origin:center}
.stk .face{animation:bob 2.4s ease-in-out infinite}.stk.bad .face{animation:wob 2.2s ease-in-out infinite}
.stk.hop .face{animation:hop .5s ease}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes hop{40%{transform:translateY(-8px) scale(1.07)}}
.tear{fill:#a9d4f5;animation:tear 2s infinite}@keyframes tear{0%{transform:translateY(0);opacity:0}25%{opacity:.9}100%{transform:translateY(12px);opacity:0}}
.zz{fill:var(--stk);font:700 12px system-ui;animation:zz 2.6s infinite}@keyframes zz{0%{opacity:0;transform:translate(0,4px)}50%{opacity:1}100%{opacity:0;transform:translate(5px,-6px)}}
@media(prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ===== Màn hình bắt đầu ===== */
.hero{position:relative;overflow:hidden;padding:28px 20px 22px;margin-top:16px;border-radius:22px}
.aura{position:absolute;inset:-40%;z-index:0;pointer-events:none;filter:blur(32px);animation:aura 14s ease-in-out infinite alternate;
 background:radial-gradient(40% 40% at 25% 30%,color-mix(in srgb,var(--n2) 40%,transparent),transparent 70%),radial-gradient(35% 35% at 78% 22%,color-mix(in srgb,var(--n1) 32%,transparent),transparent 70%),radial-gradient(40% 40% at 60% 85%,color-mix(in srgb,var(--selb) 28%,transparent),transparent 70%)}
@keyframes aura{to{transform:translate(7%,5%) rotate(16deg) scale(1.12)}}
.hero>*:not(.aura){position:relative;z-index:1}
.ttl{font-size:clamp(1.8rem,8vw,2.5rem);line-height:1.12;margin:.35em 0 .25em;letter-spacing:-.025em}
.ttl span{background:linear-gradient(90deg,var(--n1),var(--n2),var(--n1));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shn 6s linear infinite}
@keyframes shn{to{background-position:200% center}}
.up{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 14px}
@media(max-width:480px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile,.panel{background:color-mix(in srgb,var(--card) 72%,transparent);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(8px)}
.tile{padding:14px 8px;text-align:center}
.tile b{display:block;font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile small{font-size:.78rem;line-height:1.2;display:block;margin-top:4px}
.panel{padding:14px;margin:10px 0}
.panel h3{margin:0 0 10px;font-size:.78rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:8px}
.tm2{flex:1;padding:11px 4px;border:1.5px solid var(--line);background:var(--opt);color:var(--ink);border-radius:12px;transition:background .25s,border-color .25s,transform .2s}
.tm2.on{background:var(--sel);border-color:var(--selb);transform:translateY(-2px)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer}
.sw input{display:none}
.sw .k{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .25s;flex:none}
.sw .k::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0006;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.sw input:checked+.k{background:var(--selb)}.sw input:checked+.k::after{transform:translateX(20px)}
.rules{list-style:none;margin:14px 0 18px;padding:0;display:grid;gap:8px;font-size:.93rem;color:var(--mut)}
.rules li{display:flex;gap:10px;align-items:center}
.rules li::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--n1),var(--n2));flex:none}
.cta{width:100%;padding:16px;font-size:1.1rem;font-weight:700;border-radius:16px;position:relative;overflow:hidden;color:#0d1020;background:linear-gradient(90deg,var(--selb),var(--n2));box-shadow:0 8px 28px color-mix(in srgb,var(--selb) 40%,transparent);transition:transform .15s,box-shadow .25s}
.cta:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 34px color-mix(in srgb,var(--selb) 55%,transparent);filter:none}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff70 50%,transparent 70%);transform:translateX(-130%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(130%)}}

/* ===== Màn hình làm bài (cùng phong cách màn hình bắt đầu) ===== */
.top{background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;box-shadow:0 10px 30px #0004;padding:14px 16px}
.top .row>b{font-size:1rem;letter-spacing:-.01em}
.tm{font:700 1.1rem ui-monospace,Consolas,monospace;color:var(--ink);background:var(--opt);padding:5px 14px;border-radius:99px;border:1px solid var(--line)}
.tm.low{color:var(--bad);animation:lowp 1s infinite}
@keyframes lowp{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}}
.bar{height:7px;border-radius:7px;background:var(--line);margin:12px 0 6px}
.bar i{border-radius:7px;background:linear-gradient(90deg,var(--n1),var(--selb),var(--n2));box-shadow:0 0 14px color-mix(in srgb,var(--selb) 70%,transparent);transition:width .6s cubic-bezier(.3,1.3,.5,1)}
#q{border-radius:22px;padding:22px 20px;background:radial-gradient(60% 50% at 100% 0,color-mix(in srgb,var(--n2) 15%,transparent),transparent 70%),radial-gradient(50% 45% at 0 100%,color-mix(in srgb,var(--n1) 12%,transparent),transparent 70%),var(--card)}
.qh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.qh .tag{margin:0}
.qn{min-width:46px;height:46px;padding:0 10px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:1.25rem;color:#0d1020;background:linear-gradient(135deg,var(--n1),var(--n2));box-shadow:0 6px 18px color-mix(in srgb,var(--n2) 40%,transparent)}
#q h2{font-size:1.22rem;line-height:1.5;margin:.2em 0 1em;font-weight:650}
#q .opt{padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--opt) 80%,transparent);transition:transform .18s,border-color .2s,background .25s,box-shadow .25s}
#q .opt:hover{transform:translateX(4px);border-color:var(--selb)}
#q .opt b{width:32px;height:32px;font-size:.88rem;font-weight:700;transition:background .25s,color .25s}
#q .opt.sel{background:var(--sel);border-color:var(--selb);box-shadow:0 8px 24px color-mix(in srgb,var(--selb) 30%,transparent);animation:pk .38s cubic-bezier(.3,1.6,.5,1)}
#q .opt.sel b{background:linear-gradient(135deg,var(--n1),var(--n2));color:#0d1020}
@keyframes pk{0%{transform:scale(.96)}100%{transform:none}}
#q .tf{border-radius:16px;padding:14px;background:color-mix(in srgb,var(--opt) 55%,transparent)}
#q .pass{border-radius:14px;border-left:3px solid var(--n2);background:color-mix(in srgb,var(--opt) 75%,transparent)}
.tfb{padding:14px;font-size:1.05rem;border-radius:14px;border:1.5px solid var(--line)}
.tfb:hover{border-color:var(--selb)}
.tfb.sel{background:linear-gradient(135deg,var(--n1),var(--n2));color:#0d1020;border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--n2) 38%,transparent);animation:pk .38s cubic-bezier(.3,1.6,.5,1)}
.foot .btn{padding:13px 16px;border-radius:14px}
#q .foot .btn:last-child{background:linear-gradient(90deg,var(--selb),var(--n2));color:#0d1020;font-weight:700;box-shadow:0 8px 24px color-mix(in srgb,var(--selb) 38%,transparent)}

/* phản hồi đáp án ngay khi chọn */
.lock{pointer-events:none}
#q .opt.ok,#q .tfb.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink);box-shadow:0 8px 22px color-mix(in srgb,var(--ok) 28%,transparent);animation:pk .38s cubic-bezier(.3,1.6,.5,1)}
#q .opt.bad,#q .tfb.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink);animation:shk .4s}
#q .opt.ok b{background:var(--ok);color:var(--bg)}#q .opt.bad b{background:var(--bad);color:var(--bg)}
@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.fbk{display:none;margin-top:14px;padding:13px 15px;border-radius:14px;font-weight:600;overflow:hidden}
.fbk.ok{display:block;background:var(--okbg);border:1px solid var(--ok);color:var(--ok);animation:pk .35s}
.fbk.bad{display:block;background:var(--badbg);border:1px solid var(--bad);color:var(--bad);animation:pk .35s}
.fbk small{display:block;margin-top:6px;font-weight:400;color:var(--mut)}
.advbar{height:4px;border-radius:4px;background:color-mix(in srgb,currentColor 20%,transparent);margin-top:10px;overflow:hidden}
.advbar i{display:block;height:100%;width:0;background:currentColor;animation:advf linear forwards}
@keyframes advf{to{width:100%}}
#q .foot .btn.ready{animation:rdy 1.3s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 8px 24px color-mix(in srgb,var(--selb) 38%,transparent)}50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--selb) 30%,transparent),0 8px 26px color-mix(in srgb,var(--selb) 50%,transparent)}}
#q .foot .btn:disabled{opacity:.4;box-shadow:none;transform:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="cut"></div><div id="md"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCD";

/* ================= NGÂN HÀNG CÂU HỎI (trích từ tài liệu "Ôn tập giữa kì I Lịch sử và Địa lí 9 (26-27)") ================= */
const MC=[
["Đảng Bôn-sê-vích quyết định thực hiện Chính sách kinh tế mới vào thời gian nào?",["Cuối năm 1920","3/1921","12/1922","12/1925"],1],
["Trải qua 2 kế hoạch 5 năm (1928 – 1937), sản lượng công nghiệp của Liên Xô đứng thứ mấy ở Châu Âu?",["Nhất","Hai","Ba","Tư"],0],

 g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+d*.3);g.gain.exponentialRampToValueAtTime(.0001,n+d);
 s.connect(fl);fl.connect(g);g.connect(MG);s.start(n);s.stop(n+d+.03);

 $("skip").onclick=()=>end(true);
 /* 0 - 1,4s: thu bài, nhịp tim chậm */
 cs.innerHTML=`<div class="ring"></div><p>Đang thu bài</p><div class="scan"><i style="animation-duration:1.4s"></i></div>`;
 beat(0,.9);at(1000,()=>beat(0,.95));
 /* 1,4 - 3,1s: chấm từng câu, tiếng dâng cao */
 at(1400,()=>{
  cs.innerHTML=`<p>Đang chấm từng câu</p><div class="cdots">${P.map(()=>"<i></i>").join("")}</div><small id="cc">0/${P.length}</small>`;
  const dots=cs.querySelectorAll(".cdots i");let k=0;sfx.riser(1.7);
  const iv=setInterval(()=>{if(k<P.length){dots[k].classList.add("on");sfx.tick(Math.floor(k/2.4));k++;$("cc").textContent=k+"/"+P.length}else clearInterval(iv)},1650/P.length);
  T.push(iv);
 });
 /* 3,1 - 4,0s: khựng lại, tim đập dồn dập */
 at(3100,()=>{
  cs.innerHTML=`<div class="ring" style="animation-duration:.45s"></div><p class="bigq">Kết quả của bạn là</p>`;
  beat(0,1.1);beat(.34,1.2);beat(.62,1.3);tone(45,.9,{v:.5,at:.5});
 });
 /* 4,0 - 4,5s: tối sầm, im lặng một nhịp rồi bùng điểm */
 at(4000,()=>el.classList.add("dim"));
 at(4500,()=>end(false));
}

/* ================= KẾT QUẢ ================= */
function radar(v,on){
 const cx=190,cy=170,R=88,n=v.length;
 const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*r,cy+Math.sin(a)*R*r]};
 const f=x=>x.toFixed(1),ps=r=>v.map((_,i)=>pt(i,r).map(f).join(",")).join(" ");
 let h=`<svg class="radar" viewBox="0 0 380 340" role="img" aria-label="Biểu đồ mạng nhện theo chủ đề">`;
 [.25,.5,.75,1].forEach(r=>{h+=`<polygon class="rg" points="${ps(r)}"/>`});
 v.forEach((_,i)=>{const p=pt(i,1);h+=`<line class="ax" x1="${cx}" y1="${cy}" x2="${f(p[0])}" y2="${f(p[1])}"/>`});
 h+=`<g id="rdg" class="rdg${on?"":" on"}"><polygon class="rd" points="${v.map((x,i)=>pt(i,Math.max(x,.03)).map(f).join(",")).join(" ")}"/>`+
  v.map((x,i)=>{const p=pt(i,Math.max(x,.03));return `<circle class="dt" cx="${f(p[0])}" cy="${f(p[1])}" r="3.5"/>`}).join("")+`</g>`;
 v.forEach((x,i)=>{
  const a=-Math.PI/2+i*2*Math.PI/n,c=Math.cos(a),sn=Math.sin(a),lx=cx+c*(R+14),ly=cy+sn*(R+14),L=TOPICS[i];
  const an=c>.3?"start":c<-.3?"end":"middle",y0=ly+4-(L.length-1)*13*(1-sn)/2;
  h+=`<text class="lb" text-anchor="${an}" x="${f(lx)}" y="${f(y0)}">`+L.map((t,k)=>`<tspan x="${f(lx)}" dy="${k?13:0}">${esc(t)}</tspan>`).join("")+`</text>`;
 });
 return h+"</svg>";
}
function countUp(el,to,d){
 const t0=performance.now();
 let ln=-1;const st=now=>{const k=Math.min((now-t0)/d,1);el.firstChild.textContent=(to*(1-Math.pow(1-k,3))).toFixed(2);const nn=Math.floor(k*26);if(nn!==ln){ln=nn;sfx.tick(nn)}if(k<1)requestAnimationFrame(st)};
 requestAnimationFrame(st);
}
function showResult(timeout,anim){
 const R=calc(),right=R.right,tot=R.tot,ans=R.ans,score=R.score;
 const ss=SEC.map(()=>({r:0,t:0}));
 P.forEach((p,i)=>{const g=grade(p,S.A[i]);ss[p.si].r+=g[0];ss[p.si].t+=g[1]});
 const wrong=ans-right,blank=tot-ans,vals=R.tt.map((t,i)=>t?R.tr[i]/t:0);
 let wk=-1,wr=2;ss.forEach((s,k)=>{if(s.t&&s.r/s.t<wr){wr=s.r/s.t;wk=k}});
 const lvl=score>=8?"Rất tốt! Bạn nắm vững kiến thức trong tài liệu.":score>=6.5?"Khá tốt, cần củng cố thêm một số nội dung.":score>=5?"Đạt mức trung bình, bạn nên ôn lại kĩ hơn.":"Chưa đạt, hãy ôn lại tài liệu và làm lại bài.";
 let h=`<div class="card" style="text-align:center"><span class="tag">Kết quả${timeout?" · hết giờ, bài được tự động nộp":""}</span><div class="score" id="sc0">${anim?"0.00":score.toFixed(2)}<small>/10</small></div>
 <p><b>${lvl}</b>${wk>=0&&wr<1?`<br><span class="mut">Cần chú ý nhất: ${esc(SEC[wk].title)} (${ss[wk].r}/${ss[wk].t} ý đúng).</span>`:""}</p>
 <div class="stats"><div class="stat"><b style="color:var(--ok)">${right}</b>Đúng</div><div class="stat"><b style="color:var(--bad)">${wrong}</b>Sai</div><div class="stat"><b>${blank}</b>Bỏ trống</div><div class="stat"><b>${tot}</b>Tổng số ý</div></div>
 <div style="text-align:left">${SEC.map((s,k)=>`<p>${esc(s.title)}: <b>${ss[k].r}/${ss[k].t}</b></p>`).join("")}</div>
 <p class="mut"><small>Thang 10 = số ý đúng ÷ ${tot} × 10. Câu tự luận (nếu có) không được tự động chấm.</small></p>
 <div class="foot"><button class="btn" onclick="showStart()">Làm lại bài thi</button><button class="btn sec" onclick="S.only=!S.only;showResult()">${S.only?"Hiện tất cả":"Chỉ hiện câu sai / bỏ trống"}</button></div></div>
 <div class="card"><h3 style="margin-top:0">Biểu đồ năng lực theo chủ đề</h3>${radar(vals,anim)}
 <div class="tl">${TOPICS.map((t,i)=>`<div><span>${esc(t.join(" "))}</span><b>${R.tr[i]}/${R.tt[i]}</b></div>`).join("")}</div>
 <p class="mut"><small>Chủ đề được nhóm theo nội dung câu hỏi trong tài liệu. Cạnh càng xa tâm thì phần đó càng vững.</small></p></div>`;
 P.forEach((p,i)=>{
  const g=grade(p,S.A[i]),a=S.A[i],ok=g[0]===1;if(S.only&&ok)return;
  const kind=ok?"ok":has(p,a)?"bad":"blank";
  const sec=esc(secName(p).split(".")[0])+" · "+(p.t==="ti"?`ý ${p.n}`:`câu ${p.n}`);
  h+=`<div class="card rv ${p.t==="es"?"":kind==="ok"?"ok":"bad"}"><div class="rvh"><span class="tag">${sec}</span>${p.t==="es"?"":stk(kind)}</div>`;
  if(p.t==="mc"){
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2>`+p.o.map((o,j)=>`<div class="opt ${j===p.a?"ok":a===j?"bad":""}"><b>${L[j]}</b><span>${esc(o)}</span>${j===p.a?stk("ok",1):a===j?stk("bad",1):""}</div>`).join("")+
   `<div class="ex">Lời giải: đáp án đúng theo tài liệu ôn tập là <b>${L[p.a]}. ${esc(p.o[p.a])}</b>.</div>`;
  }else if(p.t==="ti"){
   h+=`<details><summary>Xem lại đoạn tư liệu</summary><div class="pass">${esc(p.pass)}<br><small>${esc(p.src)}</small></div></details><div class="tf"><p><b>${p.n}.</b> ${esc(p.q)}</p><span class="chip ${ok?"ok":"bad"}">Bạn chọn: ${a==null?"Bỏ trống":a?"Đúng":"Sai"}</span> <span class="chip">Đáp án: ${p.a?"Đúng":"Sai"}</span></div><div class="ex">Lời giải: đáp án lấy theo tài liệu ôn tập; đối chiếu với đoạn tư liệu ở trên.</div>`;
  }else if(p.t==="sa"){
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2><p>Bạn trả lời: <b>${esc(a||"(bỏ trống)")}</b></p><div class="ex">Đáp án chấp nhận: ${p.ans.map(esc).join(" / ")}</div>`;
  }else{
   h+=`<h2>Câu ${p.n}. ${esc(p.q)}</h2><p>Bài làm của bạn:<br>${esc(a||"(bỏ trống)").replace(/\n/g,"<br>")}</p><div class="ex"><b>Đáp án tham khảo:</b> ${esc(p.ref)}<br><b>Tiêu chí tự đánh giá:</b><ul>${p.rubric.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`;
  }
  h+="</div>";
 });
 const app=$("app");app.innerHTML=h;window.scrollTo(0,0);
 if(anim){
  countUp($("sc0"),score,1300);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$("rdg");if(g)g.classList.add("on")}));
 }
}
document.addEventListener("pointerdown",e=>{
 const b=e.target.closest&&e.target.closest(".btn");if(!b||b.disabled)return;
 ac();sfx.key(b.classList.contains("sm"));
});
setInterval(applyTheme,60000);
build(false);applyTheme();showStart();
</script>
</body>
</html>
